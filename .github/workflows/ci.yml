name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: modern-angular/package.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Start dev server
        run: npm run dev &
      - name: Wait for server
        run: npx wait-on http://localhost:4200
      - name: Run Cypress E2E
        run: npm run e2e